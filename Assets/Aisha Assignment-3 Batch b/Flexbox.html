<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        .container{
            height: 95vh;
            
        }
        .header{
            height: 20%;
            border: 1px solid black;
            background-color: rgb(161, 134, 186);
        }
        .center{
            display: flex;
            height: 60%;
            border: 1px solid black;
            background-color: rgb(12, 117, 117);
        }
        .footer{
            height: 20%;
            border: 1px solid black;
            background-color: rgb(193, 99, 83);
        }
        .left{
            width: 20%;
            border: 1px solid black;
            background-color: rgb(82, 180, 163);
        }
        .right{
            width: 80%;
            border: 1px solid black;
            
        }
        .top{
            height: 50%;
            border: 1px solid black;
            background-color: blanchedalmond;
        }
        .bottom{
            display: flex;
            height: 50%;
            border: 1px solid black;
           
        }
        .leftbox{
            width: 50%;
            border: 1px solid black;
            background-color: rgb(215, 179, 124);
        }
        .rightbox{
            width: 50%;
            border: 1px solid black;
            background-color: rgb(145, 186, 122);
        }
    </style>
</head>
<body><h1 align="center">Flexbox</h1>
    <div class="container">
        <div class="header"></div>
        <div class="center">
            <div class="left"></div>
            <div class="right">
                <div class="top"></div>
                <div class="bottom">
                    <div class="leftbox"></div>
                    <div class="rightbox"></div>
                </div>
            </div>
        </div>
        <div class="footer"></div>
    </div>
    
</body>
</html>
